; php-fpm settings for this app only (php -S ignores this file; start.sh passes the same flags)
display_errors = 0
log_errors = 1
max_execution_time = 10
session.name = FUCKUPSESSID
session.cookie_path = /fuckup/
session.cookie_secure = 1
session.cookie_httponly = 1
session.cookie_samesite = Strict
session.use_strict_mode = 1
