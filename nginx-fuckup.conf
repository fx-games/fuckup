# Include inside the 443 server{} of /etc/nginx/sites-enabled/ruzzoli.de.conf.
# Zone lives in /etc/nginx/conf.d/fuckup-zone.conf (installed by deploy.sh).

# The only PHP entry point. Exact match beats ^~ /fuckup/ below.
location = /fuckup/xterm/sub/backend.php {
    # brute force / account spam: 5 req/s per IP, bursts of 20 (typing is bursty)
    limit_req zone=fuckup burst=20 nodelay;
    include /etc/nginx/fastcgi_params;
    fastcgi_pass unix:/var/run/php/php-fpm.sock;
    fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
}

location ^~ /fuckup/ {
    # game data, DB, logs, helpers, dotfiles (.user.ini, .htaccess, .hidden): never over HTTP
    location ~ ^/fuckup/(webStats|xterm/(network|sub|admin|niswes\.db|intel\.sql)|router\.php|start\.sh|deploy\.sh|nginx-fuckup\.conf)|/\.|\.(log|db|sql)$ {
        return 404;
    }
    # ^~ skips the site's PHP handler: without this, other .php would be served as source
    location ~ \.php$ {
        return 404;
    }
}
